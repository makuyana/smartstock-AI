# One-click deploy on Render: web service + managed Postgres.
databases:
  - name: smartstock-db
    plan: basic-256mb
    region: frankfurt
    databaseName: smartstock
    user: smartstock

services:
  - type: web
    name: smartstock-ai
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartstock-db
          property: connectionString
      - key: META_APP_SECRET
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: INSTAGRAM_TOKEN
        sync: false
      - key: INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.x.ai/v1
      - key: LLM_MODEL
        value: grok-4
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SEED_DEMO
        value: "true"
