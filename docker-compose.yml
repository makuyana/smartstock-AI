# Local run: the app, Postgres, and a pretend Meta server.
# The keys below are fake. They are only for this laptop test.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: smartstock
      POSTGRES_PASSWORD: smartstock
      POSTGRES_DB: smartstock
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartstock -d smartstock"]
      interval: 2s
      timeout: 3s
      retries: 30

  graph-mock:
    image: python:3.12-slim
    command: ["python", "/mock/graph_mock.py"]
    volumes:
      - ./scripts/graph_mock.py:/mock/graph_mock.py:ro
    ports:
      - "18099:8099"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health')"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "43123:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Use the published host ports. This works even when the machine
      # cannot route from one container straight to another.
      DATABASE_URL: postgresql://smartstock:smartstock@host.docker.internal:54329/smartstock
      META_APP_SECRET: dev-app-secret
      WEBHOOK_VERIFY_TOKEN: dev-verify-token
      WHATSAPP_TOKEN: dev-whatsapp-token
      WHATSAPP_PHONE_NUMBER_ID: "123456789"
      INSTAGRAM_TOKEN: dev-instagram-token
      INSTAGRAM_ACCOUNT_ID: "987654321"
      LLM_API_KEY: ""
      LLM_BASE_URL: http://host.docker.internal:18099/v1
      LLM_MODEL: local-rules
      GRAPH_API_BASE_URL: http://host.docker.internal:18099
      INSTAGRAM_GRAPH_BASE_URL: http://host.docker.internal:18099
      MEDIA_DIR: /data/media
      SCHEDULER_ENABLED: "false"
      SEED_DEMO: "true"
      APP_ENV: development
    depends_on:
      db:
        condition: service_healthy
      graph-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 8s
