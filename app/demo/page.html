<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartStock demo</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      background: #0b141a;
      color: #111;
    }
    .phone {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #efeae2;
    }
    header {
      background: #075e54;
      color: #fff;
      padding: 14px 16px 10px;
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    header p { margin: 4px 0 10px; font-size: 13px; opacity: 0.9; }
    select {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 15px;
    }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .bubble {
      max-width: 85%;
      padding: 8px 10px;
      border-radius: 8px;
      white-space: pre-wrap;
      line-height: 1.35;
      font-size: 15px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.06);
    }
    .in { background: #fff; align-self: flex-start; }
    .out { background: #d9fdd3; align-self: flex-end; }
    .chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 8px 10px 0;
      background: #f0f2f5;
    }
    .chips button, form button {
      border: 0;
      background: #fff;
      border-radius: 16px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    form {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #f0f2f5;
    }
    input {
      flex: 1;
      border: 0;
      border-radius: 20px;
      padding: 10px 14px;
      font-size: 15px;
    }
    form button.send { background: #075e54; color: #fff; border-radius: 20px; }
    .hint { font-size: 12px; color: #667781; text-align: center; padding: 4px 12px 8px; background: #efeae2; }
  </style>
</head>
<body>
  <div class="phone">
    <header>
      <h1>SmartStock</h1>
      <p>Demo chat. No WhatsApp needed. Answers use the saved sheets.</p>
      <label for="shop">Business</label>
      <select id="shop" aria-label="Demo business"></select>
    </header>
    <div id="log" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <form id="composer">
      <input id="text" aria-label="Message" placeholder="Message" autocomplete="off">
      <button class="send" type="submit">Send</button>
    </form>
    <div class="hint">Numbers come from the demo sheets. Missing prices stay missing.</div>
  </div>
  <script>
    const shopSelect = document.querySelector("#shop");
    const log = document.querySelector("#log");
    const chips = document.querySelector("#chips");
    const form = document.querySelector("#composer");
    const input = document.querySelector("#text");
    let shops = [];

    function addBubble(text, side) {
      const node = document.createElement("div");
      node.className = "bubble " + side;
      node.textContent = text;
      log.appendChild(node);
      log.scrollTop = log.scrollHeight;
    }

    function renderChips() {
      chips.replaceChildren();
      const shop = shops.find((item) => item.id === shopSelect.value);
      (shop ? shop.suggestions : []).forEach((question) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = question;
        button.addEventListener("click", () => send(question));
        chips.appendChild(button);
      });
    }

    async function send(text) {
      const shopId = shopSelect.value;
      if (!shopId || !text.trim()) return;
      addBubble(text.trim(), "out");
      input.value = "";
      try {
        const response = await fetch("/demo/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ shop_id: shopId, text: text.trim() })
        });
        const payload = await response.json();
        addBubble(payload.reply || payload.detail || "No reply.", "in");
      } catch (error) {
        addBubble("The demo could not answer. Check that SEED_DEMO is on.", "in");
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      send(input.value);
    });
    shopSelect.addEventListener("change", () => {
      log.replaceChildren();
      renderChips();
      const shop = shops.find((item) => item.id === shopSelect.value);
      addBubble("You are looking at " + (shop ? shop.name : "a demo shop") + ". Ask a question, or tap one below.", "in");
    });

    fetch("/demo/shops").then((response) => response.json()).then((payload) => {
      shops = payload.shops || [];
      shopSelect.replaceChildren();
      if (!shops.length) {
        addBubble("Demo shops are not loaded yet. Set SEED_DEMO=true and restart.", "in");
        return;
      }
      shops.forEach((shop) => {
        const option = document.createElement("option");
        option.value = shop.id;
        option.textContent = shop.name;
        shopSelect.appendChild(option);
      });
      renderChips();
      addBubble("You are looking at " + shops[0].name + ". Ask a question, or tap one below.", "in");
    });
  </script>
</body>
</html>
